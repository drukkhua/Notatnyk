# Сборка Android APK: Android 16 (API 36), ТОЛЬКО arm64 (маленький размер),
# RELEASE (не debug), подписанный. Без секретов подписывается эфемерным ключом —
# APK устанавливается, но для обновляемых сборок задай keystore-секреты (см. README).
name: build-android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 36 (Android 16) + build-tools + NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Rust (+ arm64 Android target only)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android          # только arm64 → компактный APK

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend deps
        run: npm install

      # gen/android не хранится в репозитории — генерируем на лету
      - name: Init Android project
        run: npx tauri android init --ci

      # minSdk 36 задан в tauri.conf (bundle.android). compileSdk/targetSdk = 36 —
      # правим в сгенерированном gradle (иначе minSdk 36 > compileSdk даст ошибку).
      - name: Target Android 16 (compileSdk/targetSdk 36)
        run: |
          G=src-tauri/gen/android/app/build.gradle.kts
          sed -i -E 's/compileSdk *= *[0-9]+/compileSdk = 36/' "$G" || true
          sed -i -E 's/targetSdk *= *[0-9]+/targetSdk = 36/' "$G" || true
          echo "--- sdk lines ---"; grep -nE 'compileSdk|targetSdk|minSdk' "$G" || true

      - name: Build RELEASE APK (arm64 only, not debug)
        run: npx tauri android build --apk --target aarch64

      - name: Sign release APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          KS="$RUNNER_TEMP/notatnyk.jks"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"                 # свой keystore из секретов
          else
            KS_PASS=notatnyk; KEY_ALIAS=notatnyk; KEY_PASS=notatnyk
            keytool -genkeypair -v -keystore "$KS" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -dname "CN=Notatnyk, O=Notatnyk, C=UA"
            echo "::warning title=APK signing::Подписано ЭФЕМЕРНЫМ ключом (без секретов). Устанавливается, но для обновлений задай ANDROID_KEYSTORE_BASE64/PASSWORD, ANDROID_KEY_ALIAS/PASSWORD."
          fi
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          UNSIGNED=$(find src-tauri/gen/android -name '*-release-unsigned.apk' | head -1)
          [ -z "$UNSIGNED" ] && UNSIGNED=$(find src-tauri/gen/android -name '*-release.apk' | head -1)
          echo "Unsigned APK: $UNSIGNED"
          OUT="$RUNNER_TEMP/notatnyk-android16-arm64.apk"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$OUT"
          "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" "$OUT"
          "$BT/apksigner" verify --print-certs "$OUT" | head -3
          ls -lh "$OUT"
          echo "APK_OUT=$OUT" >> "$GITHUB_ENV"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: notatnyk-android16-arm64-release
          if-no-files-found: error
          path: ${{ env.APK_OUT }}
