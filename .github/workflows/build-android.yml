# Сборка Android APK. По умолчанию — debug-вариант: он подписан отладочным ключом
# и УСТАНАВЛИВАЕТСЯ напрямую (sideload) без каких-либо секретов. Готовый APK лежит
# в Artifacts прогона. Как выпускать подписанный release-APK — см. README (нужен keystore).
name: build-android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "ndk;27.1.12297006"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Rust (+ Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend deps
        run: npm install

      # gen/android не хранится в репозитории — генерируем на лету
      - name: Init Android project
        run: npx tauri android init --ci

      - name: Build APK (debug — sideload-ready)
        run: npx tauri android build --apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: notatnyk-android-apk
          if-no-files-found: error
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
