# Сборка десктопных приложений: macOS (универсальный .dmg/.app) и Windows x64 (.msi/.exe).
# • push в main / ручной запуск → готовые установщики лежат в Artifacts прогона.
# • push тега vX.Y.Z        → плюс черновик GitHub Release с установщиками.
name: build-desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# нужно, чтобы tauri-action мог создать Release по тегу
permissions:
  contents: write

# новый push в ту же ветку отменяет предыдущий незавершённый прогон
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest        # раннер Apple Silicon
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin   # один .dmg на Intel + Apple Silicon
            label: macos-universal
          - platform: windows-latest
            rust-targets: ''
            args: ''                                # нативный x64
            label: windows-x64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend deps
        run: npm install

      - name: Build app (+ draft Release on tag)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # tagName пуст на обычных push → tauri-action просто собирает, без Release
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Notatnyk ${{ github.ref_name }}
          releaseBody: |
            Готовые сборки Notatnyk.
            • macOS — универсальный `.dmg` (Intel + Apple Silicon).
            • Windows — `.msi` и `.exe` (x64).
            Android APK и iOS-сборка — в Artifacts соответствующих прогонов Actions.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      - name: Upload installers as artifacts (non-tag builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: notatnyk-${{ matrix.label }}
          if-no-files-found: warn
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.app
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
