<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Notatnyk</title>
  <!-- Стили разбиты по смыслу (порядок = каскад: токены → база → верстка → ...). -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/editor.css" />
  <link rel="stylesheet" href="css/render.css" />
  <link rel="stylesheet" href="css/money.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="side-head">
        <span class="logo"><span class="sigma">Σ</span> notatnyk</span>
        <button id="newBtn" data-i18n-title="newNote">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        </button>
      </div>
      <input id="search" class="search" type="search" data-i18n-ph="search" spellcheck="false" />
      <ul id="noteList" class="note-list"></ul>
      <div class="side-foot">
        <button id="folderBtn" class="theme-btn" data-i18n-title="folderTitle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
          <span data-i18n="folder">Папка</span>
        </button>
        <button id="settingsBtn" class="theme-btn" data-i18n-title="settingsTitle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button id="themeBtn" class="theme-btn" data-i18n-title="themeTitle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <span data-i18n="theme">Тема</span>
        </button>
      </div>
    </aside>

    <main class="workspace">
      <header class="bar">
        <div class="bar-left">
          <span id="docTitle" class="doc-title">—</span>
          <span id="counter" class="counter" hidden></span>
        </div>
        <div class="bar-right">
          <div class="seg">
            <button id="segSplit" class="seg-btn active" data-i18n-title="segSplit">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M12 3v18"/></svg>
            </button>
            <button id="segSym" class="seg-btn" data-i18n-title="segSym">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.4 2.6a1 1 0 0 1 3 3l-9 9-4 1 1-4z"/></svg>
            </button>
            <button id="segView" class="seg-btn" data-i18n-title="segView">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/></svg>
            </button>
          </div>
          <button id="fontBtn" class="ghost" data-i18n-title="fontTitle" style="font-size:13px;font-weight:700;">Aa</button>
          <button id="docBtn" class="ghost" data-i18n-title="docMode">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
          </button>
          <button id="exportBtn" class="ghost accent" data-i18n-title="exportTitle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/></svg>
          </button>
          <button id="helpBtn" class="ghost" data-i18n-title="help">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
          </button>
          <button id="delBtn" class="ghost" data-i18n-title="del">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
          </button>
        </div>
      </header>

      <div class="split" id="split" data-view="source">
        <section class="pane editorpane" id="editorpane">
          <div id="toolbar" class="toolbar"></div>
          <div class="editor-body">
            <div class="gutter" aria-hidden="true"><div id="gutterInner" class="gutter-inner"></div></div>
            <textarea id="src" spellcheck="false" data-i18n-ph="srcPh"></textarea>
          </div>
          <div id="sym" class="sym" contenteditable="true" spellcheck="false"
               role="textbox" aria-multiline="true"></div>
        </section>
        <div class="divider" id="divider" data-i18n-title="dividerTitle"></div>
        <section class="pane renderpane">
          <article id="out" class="rendered"></article>
        </section>
      </div>

      <footer class="footersum">
        <button id="foldAllBtn" class="fold-all" hidden></button>
        <span id="sumLabel"></span>
        <span id="sumState" class="ok">—</span>
      </footer>
    </main>

    <div id="cheat" class="cheat" hidden>
      <div class="cheat-box">
        <div class="cheat-head">
          <b data-i18n="cheatTitle">Синтаксис</b>
          <button id="cheatClose" class="ghost" data-i18n-title="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
        </div>
        <p class="cheat-note" data-i18n-html="cheatNote"></p>
        <table id="cheatTable" class="cheat-table"></table>
      </div>
    </div>

    <div id="tableDlg" class="cheat" hidden>
      <div class="cheat-box tbl-box">
        <div class="cheat-head">
          <b data-i18n="tableTitle">Таблица</b>
          <button id="tblClose" class="ghost" data-i18n-title="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
        </div>
        <div class="tbl-form">
          <label><span data-i18n="cols">Столбцов</span><input id="tblCols" type="number" min="1" max="12" value="3"></label>
          <label><span data-i18n="rows">Строк</span><input id="tblRows" type="number" min="1" max="50" value="3"></label>
          <button id="tblCreate" class="tbl-create" data-i18n="create">Создать</button>
        </div>
      </div>
    </div>

    <div id="docDlg" class="cheat" hidden>
      <div class="cheat-box loc-box">
        <div class="cheat-head">
          <b data-i18n="fontTitle">Шрифт документа</b>
          <button id="docDlgClose" class="ghost" data-i18n-title="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
        </div>
        <div class="loc-form">
          <div id="fontCards" class="font-cards"></div>
          <label class="font-size-row"><span data-i18n="fontSizeLbl">Размер текста</span>
            <span class="seg" id="fontSizes">
              <button type="button" class="seg-btn" data-size="14">S</button>
              <button type="button" class="seg-btn" data-size="15">M</button>
              <button type="button" class="seg-btn" data-size="16.5">L</button>
            </span>
          </label>
        </div>
      </div>
    </div>

    <div id="localeDlg" class="cheat" hidden>
      <div class="cheat-box loc-box">
        <div class="cheat-head">
          <b data-i18n="localeTitle">Ключевые слова</b>
          <button id="locClose" class="ghost" data-i18n-title="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
        </div>
        <div class="loc-form">
          <div class="loc-presets">
            <button type="button" class="tb-btn" data-lang="ru">Русский</button>
            <button type="button" class="tb-btn" data-lang="uk">Українська</button>
            <button type="button" class="tb-btn" data-lang="en">English</button>
          </div>
          <label><span data-i18n="lblCurrency">Валюта</span><input id="locCurrency" maxlength="8" spellcheck="false"></label>
          <label><span data-i18n="lblTotal">Слово итога</span><input id="locTotal" maxlength="16" spellcheck="false"></label>
          <label><span data-i18n="lblDone">Штамп</span><input id="locDone" maxlength="16" spellcheck="false"></label>
          <label><span data-i18n="lblUnit">Единица</span><input id="locUnit" maxlength="8" spellcheck="false"></label>
          <label><span data-i18n="lblYear">Суффикс года</span><input id="locYear" maxlength="4" spellcheck="false"></label>
          <label><span data-i18n="lblPositions">Слово «позиций»</span><input id="locPositions" maxlength="16" spellcheck="false"></label>
          <button id="locSave" class="tbl-create" data-i18n="save">Сохранить</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
